<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="profileme"></div>
                <h1>WhatsApp</h1>
                <div class="header-icons">
                    <button class="icon-btn" title="Obrolan baru">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
                        </svg>
                    </button>
                    <div class="sidebar-menu-wrapper">
                        <button class="icon-btn" title="Menu" id="menuis">
                            <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
                        </button>
                        <div class="sidebar-dropdown" id="sidebarDropdown">
                            <div class="dropdown-item" id="themeToggleItem">
                                <svg class="di-icon" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.51-9.59A9.03 9.03 0 0 0 12 3z"/>
                                </svg>
                                <span id="themeLabel">Light mode</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="search-container">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" class="search-input" id="searchInput" placeholder="Cari atau mulai obrolan baru">
                    <button class="search-clear-btn" id="searchClearBtn" title="Clear">✕</button>
                </div>
            </div>

            <div class="contacts-list" id="contactsList">
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-left">
                    <button class="back-btn" id="backBtn" title="Kembali">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                    </button>
                    <div class="chat-header-info" id="chatHeaderInfo">
                        <div class="chat-avatar" id="chatAvatar"></div>
                        <div>
                            <div class="chat-name" id="chatName">Pilih kontak</div>
                            <div class="chat-status" id="chatStatus"></div>
                        </div>
                    </div>
                </div>
                <div class="header-icons">
                    <button class="icon-btn" title="Panggilan video">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" title="Panggilan suara">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" title="Menu">
                        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
                    </button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">💬</div>
                    <h2>WhatsApp Web</h2>
                    <p>Kirim dan terima pesan dari kontak Anda. Pilih percakapan untuk memulai.</p>
                </div>
            </div>

            <div class="input-area" id="inputArea" style="display:none;">
                <button class="icon-btn" id="attachBtn" title="Lampirkan">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
                    </svg>
                </button>
                <div class="input-wrapper">
                    <button class="emoji-toggle-btn" id="emojiToggleBtn" title="Emoji">😊</button>
                    <input type="text" class="message-input" id="messageInput" placeholder="Ketik pesan...">
                </div>
                <button class="send-btn" id="sendBtn" title="Kirim">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="white"/>
                    </svg>
                </button>

                <div class="emoji-picker" id="emojiPicker"></div>
            </div>
        </div>

        <div class="profile-panel" id="profilePanel">
            <div class="profile-panel-header">
                <button class="icon-btn" id="closeProfileBtn" title="Tutup">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                </button>
                <h2>Info Kontak</h2>
            </div>
            <div class="profile-hero">
                <div class="profile-big-avatar" id="profileAvatar"></div>
                <div class="profile-name" id="profileName"></div>
                <div class="profile-phone" id="profilePhone"></div>
                <div class="profile-online" id="profileOnline"></div>
            </div>
            <div class="profile-section">
                <div class="profile-label">NAMA PENGGUNA</div>
                <div class="profile-value" id="profileUsername"></div>
            </div>
            <div class="profile-section">
                <div class="profile-label">BIO</div>
                <div class="profile-value" id="profileBio"></div>
            </div>
            <div class="profile-section">
                <div class="profile-label">LOKASI</div>
                <div class="profile-value" id="profileLocation"></div>
            </div>
            <div class="profile-section">
                <div class="profile-label">BERGABUNG SEJAK</div>
                <div class="profile-value" id="profileJoined"></div>
            </div>
            <div class="profile-section">
                <div class="profile-label">MINAT</div>
                <div class="profile-tags" id="profileTags"></div>
            </div>
            <div class="profile-section">
                <div class="profile-label">MEDIA YANG DIBAGIKAN</div>
                <div class="profile-value" id="profileMedia"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="biodataModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>✏️ Ubah Biodata Saya</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-field">
                    <label>NAMA TAMPILAN</label>
                    <input type="text" id="bioName" placeholder="Nama Anda">
                </div>
                <div class="modal-field">
                    <label>NAMA PENGGUNA</label>
                    <input type="text" id="bioUsername" placeholder="@nama_pengguna">
                </div>
                <div class="modal-field">
                    <label>TELEPON</label>
                    <input type="text" id="bioPhone" placeholder="+62 812 3456 7890">
                </div>
                <div class="modal-field">
                    <label>BIO</label>
                    <textarea id="bioBio" placeholder="Tulis sesuatu tentang diri Anda..."></textarea>
                </div>
                <div class="modal-field">
                    <label>LOKASI</label>
                    <input type="text" id="bioLocation" placeholder="Kota, Negara 🌍">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="modalCancelBtn">Batal</button>
                <button class="btn-save" id="modalSaveBtn">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="sc.js"></script>
</body>
</html>
